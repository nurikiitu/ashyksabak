<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>К және Г · Ашық сабақ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b53;--k:#e53935;--g:#1e88e5;--grn:#2e9e44;--yel:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(160deg,#ffecd2,#fcb69f 50%,#ff9a9e);user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;touch-action:manipulation}
.screen{display:none;min-height:100vh;flex-direction:column}.screen.on{display:flex}
.btn{background:#fff;font-weight:900;font-size:clamp(16px,1.8vw,22px);padding:12px 18px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.shake{animation:shake .4s}@keyframes shake{0%,100%{translate:0}20%,60%{translate:-12px}40%,80%{translate:12px}}
.pop{animation:pop .35s}@keyframes pop{0%{scale:.4}70%{scale:1.15}100%{scale:1}}

/* home */
.hero{text-align:center;padding:30px 16px 10px}
.letters{display:flex;justify-content:center;gap:24px;margin-bottom:6px}
.big{width:clamp(110px,14vw,170px);height:clamp(110px,14vw,170px);border-radius:32px;display:grid;place-items:center;font-size:clamp(80px,10vw,124px);font-weight:900;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.big.k{background:var(--k)}.big.g{background:var(--g)}
.hero h1{font-size:clamp(34px,5vw,64px);font-weight:900;margin-top:10px}
.hero p{font-size:clamp(17px,2vw,24px);font-weight:800;opacity:.8}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;max-width:1100px;margin:16px auto 30px;padding:0 16px;width:100%}
.card{background:#fff;border-radius:30px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 9px 0 rgba(0,0,0,.15);text-align:center}
.card:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.card .ic{font-size:clamp(56px,6vw,76px)}
.card .t{font-size:clamp(24px,2.6vw,32px);font-weight:900}
.card .s{font-size:clamp(15px,1.6vw,19px);font-weight:800;opacity:.7}

/* game */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.gt{flex:1;text-align:center;font-size:clamp(20px,2.8vw,36px);font-weight:900}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.6)}.dots i.d{background:var(--grn)}.dots i.c{background:#fff;transform:scale(1.25);box-shadow:0 0 0 3px var(--ink)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:8px 16px 24px}
.q{font-size:clamp(24px,3vw,42px);font-weight:900;text-align:center}
.pic{font-size:clamp(110px,14vw,190px);line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}
.word{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wl{width:clamp(56px,7vw,92px);height:clamp(70px,8.6vw,112px);background:#fff;border-radius:18px;display:grid;place-items:center;font-size:clamp(44px,5.6vw,76px);font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.wl.hole{background:rgba(255,255,255,.4);border:5px dashed #fff;box-shadow:none}
.wl.hole.over{background:#fff7c2;border-color:var(--yel)}
.wl.k{color:var(--k)}.wl.g{color:var(--g)}
.tiles{display:flex;gap:28px}
.lt{width:clamp(110px,13vw,160px);height:clamp(110px,13vw,160px);border-radius:28px;color:#fff;font-size:clamp(80px,9.5vw,116px);font-weight:900;box-shadow:0 9px 0 rgba(0,0,0,.25);touch-action:none}
.lt.k{background:var(--k)}.lt.g{background:var(--g)}
.lt.drag{position:relative;z-index:10;box-shadow:0 20px 30px rgba(0,0,0,.3)}
.howto{font-weight:800;font-size:clamp(15px,1.6vw,20px);background:rgba(255,255,255,.6);padding:6px 16px;border-radius:14px}
.bins{display:flex;gap:clamp(14px,3vw,40px);width:100%;max-width:900px;justify-content:center}
.bin{flex:1;max-width:380px;min-height:clamp(150px,18vw,220px);border-radius:30px;border:6px solid #fff;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px;box-shadow:0 9px 0 rgba(0,0,0,.2)}
.bin.k{background:var(--k)}.bin.g{background:var(--g)}
.bin b{font-size:clamp(60px,7vw,92px);line-height:1.1}
.bin .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:clamp(28px,3.2vw,42px)}
.bin.over{outline:8px solid var(--yel)}
.card2{background:#fff;border-radius:30px;padding:10px 40px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 0 rgba(0,0,0,.15);touch-action:none;cursor:grab;min-width:220px}
.card2 .pic{font-size:clamp(100px,12vw,160px)}
.card2 .nm{font-size:clamp(26px,3vw,40px);font-weight:900;min-height:1.3em}
.card2 .nm .k{color:var(--k)}.card2 .nm .g{color:var(--g)}
#flash{position:fixed;left:50%;top:14%;translate:-50% 0;font-size:clamp(34px,5vw,64px);font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .2s;z-index:15;white-space:nowrap}
#flash.on{opacity:1}
#final{position:fixed;inset:0;background:rgba(40,20,40,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#final.on{display:flex}
.fb{background:#fff;border-radius:36px;padding:30px 46px;text-align:center;animation:pop .45s;max-width:96vw}
.fb .st{font-size:clamp(56px,7vw,90px)}
.fb h2{font-size:clamp(50px,7vw,100px);font-weight:900;color:var(--grn)}
.fb p{font-size:clamp(20px,2.4vw,30px);font-weight:900;margin:8px 0 20px}
.fb .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.fb .btn{background:var(--g);color:#fff}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
@media(max-width:700px){.tiles{gap:16px}.bins{gap:10px}.card2{padding:8px 20px}.wl{border-radius:12px}}
</style>
</head>
<body>
<section id="home" class="screen on">
  <div class="hero"><div class="letters"><div class="big k">К</div><div class="big g">Г</div></div>
    <h1>К және Г дыбыстары</h1><p>Ашық сабақ · 1-сынып</p></div>
  <div class="cards" id="cards"></div>
</section>
<section id="game" class="screen">
  <div class="top"><button class="btn" onclick="goHome()">🏠 Басты бет</button><div class="gt" id="gt"></div><button class="btn" id="snd" onclick="snd=!snd;this.textContent=snd?'🔊':'🔇'">🔊</button></div>
  <div class="stage" id="stage"></div>
</section>
<div id="final"><div class="fb"><div class="st" id="fst"></div><h2 id="fh">Жарайсың!</h2><p id="fp"></p>
  <div class="row"><button class="btn" onclick="start(CUR)">🔁 Қайтадан</button><button class="btn" onclick="goHome()">🏠 Басты бет</button></div></div></div>
<div id="flash"></div><canvas id="cf"></canvas>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const reanim=(e,c)=>{e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};
let snd=true,AC=null;
function tone(f,d,t=0,ty='sine',v=.22){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;const n=AC.currentTime+t;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function beep(k){if(!snd)return;if(k==='ok'){tone(660,.12);tone(990,.18,.1)}else if(k==='bad'){tone(170,.3,0,'square',.08)}else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,i*.13))}}
let flT;function flash(t){const f=$('#flash');f.textContent=t;f.classList.add('on');clearTimeout(flT);flT=setTimeout(()=>f.classList.remove('on'),1000)}
let CF=0;function stopCF(){CF++;const c=$('#cf');c.width=c.width}
function confetti(){const my=++CF,c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;setTimeout(()=>{if(CF===my)stopCF()},4500);
  const cols=['#e53935','#1e88e5','#ffd23f','#2e9e44','#ff9a9e'];const P=Array.from({length:170},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:-2+Math.random()*4,vy:3+Math.random()*5,s:10+Math.random()*12,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.floor(Math.random()*5)]}));
  (function f(){x.clearRect(0,0,c.width,c.height);if(my!==CF)return;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});requestAnimationFrame(f)})()}

/* сөздер: [сурет, сөз] — әр сөзде К немесе Г тек біреуі */
const KW=[['📖','кітап'],['☀️','күн'],['👁️','көз'],['⛵','кеме'],['🦔','кірпі'],['🍵','кесе'],['🔑','кілт'],['🦋','көбелек'],['🐐','ешкі'],['🦅','бүркіт'],['❤️','жүрек'],['🪣','шелек'],['👗','көйлек'],['🌵','тікен']];
const GW=[['🌸','гүл'],['🎸','гитара'],['📰','газет'],['💎','гауһар'],['🌽','жүгері'],['🐂','өгіз'],['8️⃣','сегіз'],['🌾','егін']];
const letterOf=w=>w.includes('к')?'к':'г';

/* drag helper */
function drag(elm,targetSel,onDrop){elm.addEventListener('pointerdown',e=>{e.preventDefault();const sx=e.clientX,sy=e.clientY;let over=null,moved=false;try{elm.setPointerCapture(e.pointerId)}catch(_){}
  const tgt=ev=>{elm.style.visibility='hidden';const t=document.elementFromPoint(ev.clientX,ev.clientY);elm.style.visibility='';return t&&t.closest(targetSel)};
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)>10){moved=true;elm.classList.add('drag')}if(!moved)return;elm.style.transform=`translate(${dx}px,${dy}px)`;const t=tgt(ev);if(t!==over){over&&over.classList.remove('over');over=t;over&&over.classList.add('over')}};
  const up=ev=>{elm.removeEventListener('pointermove',mv);elm.removeEventListener('pointerup',up);elm.removeEventListener('pointercancel',up);over&&over.classList.remove('over');elm.classList.remove('drag');elm.style.transform='';
    const t=moved?tgt(ev):null;if(!moved)onDrop(null,true);else if(t)onDrop(t,false)};
  elm.addEventListener('pointermove',mv);elm.addEventListener('pointerup',up);elm.addEventListener('pointercancel',up)})}

/* engine */
let RID=0,CUR=null;const alive=id=>id===RID;
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
function start(g){RID++;stopCF();$('#final').classList.remove('on');CUR=g;$('#gt').textContent=g.icon+' '+g.title;show('game');const st=$('#stage'),id=RID;
  const tasks=g.make();let i=0,err=0;
  const step=()=>{if(!alive(id))return;st.innerHTML='';const d=el('div','dots');tasks.forEach((_,j)=>d.append(el('i',j<i?'d':j===i?'c':'')));st.append(d);
    let fired=false;g.render(tasks[i],st,()=>{if(fired)return;fired=true;beep('ok');flash('Дұрыс! 🎉');i++;setTimeout(()=>{if(!alive(id))return;i>=tasks.length?finish(id,err):step()},1100)},()=>{err++;beep('bad')})};step()}
function finish(id,err){if(!alive(id))return;RID++;const s=err===0?3:err<=2?2:1;$('#fst').textContent='⭐'.repeat(s)+'☆'.repeat(3-s);$('#fh').textContent=s===3?'Керемет!':'Жарайсың!';
  $('#fp').textContent=err?`Қате: ${err}. Тағы жаттығайық!`:'Бірде-бір қатесіз! 🏆';$('#final').classList.add('on');beep('win');confetti()}
function goHome(){RID++;stopCF();$('#final').classList.remove('on');show('home')}
const colorWord=w=>[...w].map(c=>c==='к'?`<span class="k">к</span>`:c==='г'?`<span class="g">г</span>`:c).join('');

const GAMES=[
/* 1. Жоғалған әріп */
{icon:'🔤',title:'Жоғалған әріпті тап',sub:'Сөзге К немесе Г әрпін қой',
 make:()=>shuffle([...pick(KW,6),...pick(GW,6)]),
 render(t,st,ok,bad){const [e,w]=t,L=letterOf(w),pos=w.indexOf(L);
   st.append(el('div','q','Суретке қара. Қай әріп жетпейді?'),el('div','pic',e));
   const wd=el('div','word');let hole;[...w].forEach((c,j)=>{const b=el('div','wl'+(j===pos?' hole':''),j===pos?'':c.toUpperCase());if(j===pos)hole=b;wd.append(b)});st.append(wd);
   const tl=el('div','tiles');let done=false;
   [['к','К'],['г','Г']].forEach(([v,lab])=>{const b=el('button','lt '+(v==='к'?'k':'g'),lab);
     const put=()=>{if(done)return;if(v===L){done=true;hole.className='wl pop '+(v==='к'?'k':'g');hole.textContent=lab;ok()}else{bad();reanim(b,'shake');flash(`${w.toUpperCase()} — ${L.toUpperCase()} әрпі`)}};
     drag(b,'.hole',(tgt,tap)=>put());tl.append(b)});
   st.append(tl,el('div','howto','👆 Әріпті ұстап, бос орынға апар немесе басып таңда'))}},
/* 2. Себетке сал */
{icon:'🧺',title:'Себетке сал',sub:'Суреттің атын айт: К ма, Г ма?',
 make:()=>shuffle([...pick(KW,6),...pick(GW,6)]),
 render(t,st,ok,bad){const [e,w]=t,L=letterOf(w);
   st.append(el('div','q','Суреттің атын айт. Сөзде қай дыбыс бар?'));
   const c=el('div','card2',`<div class="pic">${e}</div><div class="nm">?</div>`);st.append(c);
   const bins=el('div','bins');const B={};[['к','К'],['г','Г']].forEach(([v,lab])=>{const b=el('button','bin '+(v==='к'?'k':'g'),`<b>${lab}</b><div class="in"></div>`);b.dataset.v=v;B[v]=b;b.onclick=()=>put(v);bins.append(b)});
   st.append(bins,el('div','howto','👆 Суретті ұстап, себетке апар немесе себетті бас'));let done=false;
   function put(v){if(done)return;if(v===L){done=true;c.querySelector('.nm').innerHTML=colorWord(w);B[v].querySelector('.in').append(el('span','pop',e));ok()}
     else{bad();reanim(B[v],'shake');c.querySelector('.nm').innerHTML=colorWord(w);flash(`${w} — ${L.toUpperCase()} дыбысы`)}}
   drag(c,'.bin',(tgt,tap)=>{if(tgt)put(tgt.dataset.v)})}},
];
GAMES.forEach(g=>{const c=el('button','card',`<div class="ic">${g.icon}</div><div class="t">${g.title}</div><div class="s">${g.sub}</div>`);c.onclick=()=>start(g);$('#cards').append(c)});
</script>
</body>
</html>
